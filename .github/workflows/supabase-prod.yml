name: Supabase (prod) migrations

on:
  push:
    branches:
      - main

jobs:
  db-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_REF:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Missing SUPABASE_PROJECT_REF or SUPABASE_DB_PASSWORD secret." >&2
            exit 1
          fi
          # Bypass `supabase link` (Management API api-keys SchemaError).
          # Use pooler session mode — direct db.*.supabase.co often blocked from GHA (IPv4).
          ENC_PASS=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENC_PASS}@aws-1-eu-central-1.pooler.supabase.com:5432/postgres"
          supabase db push --db-url "$DB_URL"
